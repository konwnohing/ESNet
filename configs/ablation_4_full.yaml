data:
  dataset: "kitti"
  root_dir: "/root/autodl-tmp/kitti_dataset"
  crop_height: 256
  crop_width: 512
model:
  max_disp: 192
training:
  num_epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  loss:
    smoothness:
      weight: 0.1
    edge_alpha: 15.0
    ohem_fraction: 0.3
    relative_loss_weight: 2.0 # 🌟 开启 EDW，惩罚远景漂移
logging:
  checkpoint_dir: "./checkpoints_ablation_4"
  tensorboard_dir: "./tensorboard_ablation_4"