
# ==========================================================
# ESNet OHEM Ratio Ablation Configuration
# ==========================================================

data:
  dataset: "kitti"
  root_dir: "/root/autodl-tmp/kitti_dataset"
  kitti_year: 2015
  crop_height: 320
  crop_width: 640
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true

model:
  name: "EnhancedStereoNet"
  backbone_type: "resnet18"
  max_disp: 192
  use_prn: true
  use_gate: true
  checkpoint: "/root/autodl-tmp/project/stereo-matching/checkpoints_sceneflow_pretrain_1/model_best.pth"

training:
  num_epochs: 300
  batch_size: 6
  num_workers: 4
  learning_rate: 0.00002
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  freeze_bn: false
  ohem_ratio: 0.3

  optimizer:
    type: "Adam"
    weight_decay: 0.0001

  scheduler:
    type: "CosineAnnealingLR"
    T_max: 300
    eta_min: 0.000001

# 注意：train_ohem.py 会把这个顶层 loss 自动同步到 training.loss
loss:
  weights:
    p3: 0.5
    p2: 0.7
    p1: 1.0
    final: 1.2
    full_res: 0.8
    disp_coarse: 0.2

  ohem_fraction: 0.3
  edge_alpha: 15.0
  relative_loss_weight: 2.0

  smoothness:
    weight: 0.1

  spatial_grad:
    enabled: true
    weight: 0.1

  gate_refinement:
    enabled: true
    weight: 1.0
    alpha: 1.0

  physics_constraint:
    enabled: true
    weight: 0.05

  negative_penalty:
    weight: 0.1

  ssim:
    enabled: false

  distribution:
    enabled: false
    weight: 0.0
    temperature: 0.1

logging:
  checkpoint_dir: "./checkpoints_ohem_ablation/base"
  tensorboard_dir: "./tensorboard_ohem_ablation/base"
  save_freq: 5
  val_freq: 1
  print_freq: 10