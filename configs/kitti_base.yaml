# ==========================================================
# 📊 KITTI 2015 基础配置文件 (Base Configuration)
# ==========================================

# 1. 核心数据配置
data:
  dataset: "kitti"
  root_dir: "/root/autodl-tmp/kitti_dataset"
  kitti_year: 2015
  crop_height: 384
  crop_width: 1152
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true  # 训练时开启增强，验证时 auto_ablation 脚本会自动关掉

# 2. 模型架构配置
model:
  name: "EnhancedStereoNet"
  backbone_type: "resnet18"
  max_disp: 192
  use_prn: true
  use_gate: true
  # 🌟 新增：预训练权重路径（请指向你之前在 SceneFlow 上练好的 pth）
  checkpoint: "/root/autodl-tmp/project/stereo-matching/checkpoints_sceneflow_pretrain/model_best.pth"

# 3. 训练超参数
training:
  num_epochs: 300
  batch_size: 8    # 4090 显存充足可调至 8，但 4 比较稳定
  num_workers: 4
  learning_rate: 0.0001
  optimizer:
    type: "Adam"
    weight_decay: 0.0001
  scheduler:
    type: "OneCycleLR" 
    max_lr: 0.001
    pct_start: 0.05
    anneal_strategy: "cos"

# 4. 损失函数配置 (Loss Functions)
loss:
  # 权重分配：p3(初始), prn_p2, prn_p1, final(门控输出)
  weights: 
    p3: 0.5
    p2: 0.7
    p1: 1.0
    final: 1.2
  ohem_fraction: 0.3    # 🌟 核心创新：仅计算误差最大的 30% 像素，专治车辆边缘
  smoothness_weight: 0.1
  edge_alpha: 15.0      # 边缘感知平滑系数

# 5. 日志与保存设置
logging:
  checkpoint_dir: "./checkpoints/kitti_base"
  tensorboard_dir: "./tensorboard/kitti_base"
  save_freq: 5          # 每 5 个 epoch 保存一次
  val_freq: 1           # 每个 epoch 跑一次验证集
  print_freq: 10        # 每 10 个 batch 打印一次日志