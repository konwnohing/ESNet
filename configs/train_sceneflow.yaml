# =============== Train 配置：SceneFlow 完整训练 ===============

debug:
  enable_debug_mode: false        
  print_gradients: false          
  print_disparity_stats: false

model:
  backbone_type: "resnet18"
  max_disp: 192                   # SceneFlow 标准最大视差
  
  negative_penalty:
    enabled: false                # 基础版先不加花里胡哨的惩罚，跑出 Base 线再说

data:
  dataset: "sceneflow"            # 对应 dataloader 里的 dataset_name
  root_dir: "/root/autodl-fs/SceneFlow"  # 你的 AutoDL 数据路径
  crop_height: 256                # 原图是 540x960，随机裁剪到 256x512 节省显存
  crop_width: 512
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

  # 🌟 数据增强（必须全部开启，让模型学会泛化）
  augmentation:
    enabled: true
    color_aug: true               # 亮度、对比度、饱和度随机扰动
    geometric_aug: false          # 🌟 拼写修复：fales -> false。保持随机裁剪，关闭危险的垂直平移
    crop_scale: [1.0, 1.0]        # 保持比例，避免破坏视差物理含义
    hflip_prob: 0.0               # 立体匹配严禁随意左右翻转，保持 0.0

training:
  overfit: false                  # 确保关闭 overfit 模式
  batch_size: 4                   # 24G 显存通常能跑 4 或 8，如果爆显存请降到 2
  num_workers: 8                  # 🌟 关键：AutoDL 多核 CPU 拉满，加速图片加载
  num_epochs: 20                  # SceneFlow 通常 15~20 轮收敛

  learning_rate: 0.00001            # 初始学习率
  weight_decay: 0.0001            
  
  optimizer: "adam"
  scheduler: "step"               
  lr_step_size: 40000             # 🌟 核心修复：将 4000 改为 40000，确保 RGB 卷积核有足够的寿命发育！
  lr_gamma: 0.5

  gradient_clip_norm: 1.0         # 防止梯度爆炸的安全带

  negative_disparity:
    enabled: false

  # 🌟 黄金多尺度 Loss 权重配比
  loss_weights:
    final: 1.0
    full_res: 0.8
    p1: 0.6
    p2: 0.4
    p3: 0.2
    disp_coarse: 0.5              # 引导 Transformer 找对方向
    p4: 0.0
    p5: 0.0
    c5: 0.0

  loss:
    type: "multilevel"
    negative_penalty:
      enabled: false
    smoothness:
      enabled: true               
      weight: 0.01                # 🌟 修改点 1：恢复温和的平滑约束，利用 RGB 柔和地梳理表面
      edge_aware: true
    ssim:
      enabled: false
    physics_constraint:
      enabled: false

logging:
  log_dir: "./logs_sceneflow"
  checkpoint_dir: "./checkpoints_sceneflow"
  tensorboard_dir: "./tensorboard_sceneflow"

  save_freq: 2000                 # 每 2000 步保存一次
  val_freq: 1000                  # 每 1000 步验证一次

  visualization:
    enabled: true                 
    save_disparity_maps: true
    save_negative_masks: false
    frequency: 500                # 每 500 步在 TensorBoard 画一次视差图

evaluation:
  metrics: ["epe", "bad_3.0", "bad_1.0"]
  max_disp: 192

  validation:
    compute_3px_error: true       # D1-all/3px error 是 SceneFlow 的核心指标
    compute_1px_error: true
    compute_negative_stats: false